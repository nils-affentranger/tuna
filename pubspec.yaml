name: tuna
description: "Tuner and metronome."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/instruments.json
    - assets/ticks/
  fonts:
    - family: myna-outlined
      fonts:
        - asset: assets/fonts/myna-outlined.otf
    - family: myna-solid
      fonts:
        - asset: assets/fonts/myna-solid.otf
